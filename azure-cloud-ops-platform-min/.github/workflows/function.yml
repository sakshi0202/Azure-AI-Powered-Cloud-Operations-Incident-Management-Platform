name: remediation-function
on:
  push:
    branches: [main]
    paths: ['functions/**']
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy function
        run: |
          APP=$(az functionapp list -g rg-cloudops-dev --query '[0].name' -o tsv)
          cd functions/remediation
          zip -r "$GITHUB_WORKSPACE/function.zip" .
          cd "$GITHUB_WORKSPACE"
          az functionapp deployment source config-zip --resource-group rg-cloudops-dev --name "$APP" --src "$GITHUB_WORKSPACE/function.zip"
